# DebugSync Backend — Application Configuration
# -----------------------------------------------

server:
  port: 8080
  tomcat:
    max-http-form-post-size: 100MB
    max-swallow-size: 100MB
  error:
    include-message: always
    include-exception: true

spring:
  application:
    name: DebugSync

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB

  # H2 file database (swap to PostgreSQL for production)
  #
  # The data directory is overridable via CAUSIFY_DATA_DIR so the desktop app can
  # keep the database in the user's profile (Electron userData) instead of inside
  # the install directory. The old location — resolved relative to the backend's
  # working directory — sits under resources/backend/data in a packaged install,
  # which an app update deletes and a Program Files install cannot even write.
  # Defaults to ./data so `mvn spring-boot:run` behaves exactly as before.
  datasource:
    url: jdbc:h2:file:${CAUSIFY_DATA_DIR:./data}/debugsync;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  # JPA / Hibernate settings
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false

  # H2 console (for debugging, access at /h2-console)
  h2:
    console:
      enabled: true
      path: /h2-console

# Custom DebugSync configuration
debugsync:
  ai:
    # Bring your own provider: OpenRouter, Groq, Gemini, Bedrock, OpenAI, or any
    # OpenAI-compatible endpoint. All four settings are blank on purpose — paste
    # the key into the UI instead, which verifies it with a real call, activates
    # it live, and keeps it out of this file and out of git.
    api-key: ${AI_API_KEY:}
    # Blank means "work it out from the key's shape" (sk-or- -> OpenRouter,
    # gsk_ -> Groq, AIza/AQ. -> Gemini, ABSK -> Bedrock, sk- -> OpenAI).
    provider: ${AI_PROVIDER:}
    # Blank means the provider's own default model.
    model: ${AI_MODEL:}
    # Only used when provider is "custom", e.g. https://api.together.xyz/v1
    base-url: ${AI_BASE_URL:}
  cors:
    allowed-origins: http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:3000,http://localhost:3001
  git:
    workspace-root: ./git-workspaces
    timeout-seconds: 30
