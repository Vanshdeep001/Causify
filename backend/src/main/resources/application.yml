# DebugSync Backend — Application Configuration
# -----------------------------------------------

server:
  port: 8080
  tomcat:
    max-http-form-post-size: 100MB
    max-swallow-size: 100MB
  error:
    include-message: always
    include-exception: true

spring:
  application:
    name: DebugSync

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 100MB

  # H2 in-memory database (swap to PostgreSQL for production)
  datasource:
    url: jdbc:h2:file:./data/debugsync;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  # JPA / Hibernate settings
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false

  # H2 console (for debugging, access at /h2-console)
  h2:
    console:
      enabled: true
      path: /h2-console

# Custom DebugSync configuration
debugsync:
  ai:
    openrouter-api-key: ${OPENROUTER_API_KEY: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}
  cors:
    allowed-origins: http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:3000,http://localhost:3001
  git:
    workspace-root: ./git-workspaces
    timeout-seconds: 30
