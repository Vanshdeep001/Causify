# =============================================
# ShopVerse — Local Development Environment
# =============================================
# Usage:
#   docker-compose up -d      → Start MongoDB + Redis
#   docker-compose down       → Stop services
#   docker-compose down -v    → Stop + remove data volumes
# =============================================

version: "3.9"

services:
  # ---- MongoDB ----
  mongodb:
    image: mongo:7
    container_name: shopverse-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: shopverse
    volumes:
      - mongodb_data:/data/db
    networks:
      - shopverse-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # ---- Redis ----
  redis:
    image: redis:7-alpine
    container_name: shopverse-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - shopverse-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru

volumes:
  mongodb_data:
    driver: local
  redis_data:
    driver: local

networks:
  shopverse-network:
    driver: bridge
